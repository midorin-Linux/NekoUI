[workspace]
members = ["agent", "api-server","app", "config", "events", "inference", "memory", "telemetry", "tools", "wizard"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
nekoui-agent = { path = "agent", package = "agent" }
nekoui-api-server = { path = "api-server", package = "api-server" }
nekoui-app = { path = "app", package = "app" }
nekoui-config = { path = "config", package = "config" }
nekoui-events = { path = "events", package = "events" }
nekoui-inference = { path = "inference", package = "inference" }
nekoui-memory = { path = "memory", package = "memory" }
nekoui-telemetry = { path = "telemetry", package = "telemetry" }
nekoui-tools = { path = "tools", package = "tools" }
nekoui-wizard = { path = "wizard", package = "wizard" }

anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
config = "0.15"
dotenvy = "0.15"
dialoguer = "0.12"
indicatif = "0.18"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"
