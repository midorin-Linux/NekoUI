[package]
name = "nekoui"
version = "1.0.0-rc"
edition = "2024"

[dependencies]
anyhow = "1.0"
argon2 = "0.6.0-rc.8"
aws-lc-rs = "1.17"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
config = "0.15"
dashmap = "6.2"
derive_builder = "0.20"
dotenvy = "0.15"
dialoguer = "0.12"
hex = "0.4"
indicatif = "0.18"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
rig = { package = "rig-core", version = "0.38", features = ["image", "derive"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["full"] }
tokio-retry = "0.3"
tower-http = { version = "0.6.11", features = ["cors"] }
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-native-tls", "chrono"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
zeroize = "1.9"